name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test --workspace=apps/server -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/server/coverage

      - name: Check coverage threshold
        run: |
          echo "Verifying coverage > 80%"
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('./apps/server/coverage/coverage-final.json', 'utf8'));
            let total = 0, covered = 0;
            for (const f of Object.values(r)) {
              for (const [id, c] of Object.entries(f.s)) {
                total++;
                if (c > 0) covered++;
              }
            }
            const pct = (covered / total) * 100;
            console.log('Statement coverage: ' + pct.toFixed(2) + '%');
            if (pct < 80) {
              console.error('FAIL: coverage below 80% threshold');
              process.exit(1);
            }
            console.log('PASS: coverage meets 80% threshold');
          "

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build server
        run: npm run build --workspace=apps/server

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/server/dist
            apps/web/dist

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: formatiflive-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: formatiflive-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
